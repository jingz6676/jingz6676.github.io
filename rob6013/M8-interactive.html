<style>/* ROB-GY 6013 â€” shared deck stylesheet.  Every lecture deck links this file.
   The stage is a fixed 1280x720 canvas scaled to the viewport, so a slide
   authored on one machine lays out identically everywhere. */

:root{
  --bg:#fbfbf9; --ink:#17181a; --dim:#6b6b6b; --rule:#dcdad4;
  --acc:#0b5fa5;        /* the course blue â€” same as the homepage */
  --warm:#a8501c;       /* reserved for the robotics payoff, used sparingly */
  --panel:#f2f1ec; --shade:#e9e8e2; --ok:#1d6b3f;

  /* semantic palette â€” a colour means the same object in every deck */
  --c-in:#3b6ea5;      /* the input space, the domain, what you are free to choose */
  --c-out:#17796b;     /* the output space, the codomain, what the map can reach */
  --c-null:#7a5ea8;    /* what gets destroyed: null space, kernel, lost directions */
  --c-res:#b4531f;     /* the residual, the error, what is left over */
  --c-data:#9a7215;    /* measurements and data, as opposed to model */
  --c-res-ok:#1d6b3f;  /* the result, the thing that exists, the answer */
  --fs:26px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121315; --ink:#e8e6e2; --dim:#9a9a96; --rule:#2e3033;
  --acc:#7ab6ea; --warm:#e0906a; --panel:#1a1c1f; --shade:#212429; --ok:#6fc08f;
  --c-in:#7fb2dd; --c-out:#4fc3ac; --c-null:#b79ae0; --c-res:#e0906a;
  --c-data:#e2c169; --c-res-ok:#6fc08f;
}}
:root[data-theme="dark"]{
  --bg:#121315; --ink:#e8e6e2; --dim:#9a9a96; --rule:#2e3033;
  --acc:#7ab6ea; --warm:#e0906a; --panel:#1a1c1f; --shade:#212429; --ok:#6fc08f;
  --c-in:#7fb2dd; --c-out:#4fc3ac; --c-null:#b79ae0; --c-res:#e0906a;
  --c-data:#e2c169; --c-res-ok:#6fc08f;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font:400 var(--fs)/1.5 Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}

/* ---------- stage ---------- */
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform-origin:center center;background:var(--bg)}
.slide{position:absolute;inset:0;padding:54px 64px 62px;display:none;flex-direction:column}
.slide.on{display:flex}
.slide.title{justify-content:center;padding:54px 90px}

/* ---------- type ---------- */
h1{font-size:52px;line-height:1.12;font-weight:600;margin:0 0 14px;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:36px;line-height:1.16;font-weight:600;margin:0 0 18px;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:24px;font-weight:600;margin:14px 0 6px}
p{margin:0 0 14px;max-width:64ch}
.lead{font-size:30px;line-height:1.4}
.dim{color:var(--dim)}
.warm{color:var(--warm)}
.acc{color:var(--acc)}
small,.small{font-size:20px;line-height:1.45}
.tiny{font-size:16px;line-height:1.45;color:var(--dim)}
b,strong{font-weight:600}
ul,ol{margin:6px 0 14px;padding-left:26px}
li{margin:7px 0}
li::marker{color:var(--dim)}
ul.tight li{margin:3px 0}
a{color:var(--acc)}
code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86em}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:.8em;border:1px solid var(--rule);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--panel)}

/* eyebrow above a slide title: where we are in the argument */
.eyebrow{font:600 15px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acc);margin:0 0 12px}
.eyebrow.w{color:var(--warm)}

/* ---------- layout helpers ---------- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start;flex:1;min-height:0}
.cols.w6040{grid-template-columns:1.5fr 1fr}

#m8break{position:fixed;inset:0;z-index:60;display:none;place-items:center;
  background:var(--bg)}
body.m8break-on #m8break{display:grid}
#m8break .bx{text-align:center;font-family:Georgia,serif;color:var(--ink)}
#m8break .bl{font:400 44px/1.2 Georgia,serif;margin:0 0 18px}
#m8break .bt{font:600 92px/1 ui-monospace,Menlo,monospace;fill:var(--ink)}
#m8break .bb{font:400 26px/1.3 Georgia,serif;color:var(--dim);margin-top:16px}
#m8break .ring0{stroke:var(--rule)}
#m8break .ring1{stroke:var(--c-in);transition:stroke-dashoffset .25s linear}
body.print #m8break{display:none!important}
@media print{#m8break{display:none!important}}
